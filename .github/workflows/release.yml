name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      # debian:trixie has no git and actions/checkout runs inside this container, so the
      # dependencies go in before the checkout.  dpkg-dev (dpkg-shlibdeps) and file are
      # what CPack's DEB generator needs on top of the build dependencies.
      - name: Install git and the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            g++ cmake ninja-build qt6-base-dev qt6-tools-dev qt6-svg-plugins \
            libx11-dev libxfixes-dev dpkg-dev file

      - uses: actions/checkout@v7.0.1

      - name: Check that the tag matches the project version
        run: |
          set -eu
          version=$(sed -n 's/^project(tinyshot VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match project(tinyshot VERSION ${version}) in CMakeLists.txt"
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Build the .deb
        working-directory: build
        run: cpack -G DEB

      - name: Verify the .deb
        run: |
          dpkg-deb -I build/tinyshot_*.deb
          dpkg-deb -c build/tinyshot_*.deb

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: deb
          path: build/tinyshot_*.deb
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    # The tag has to match the runtime in the manifest (org.kde.Platform 6.11);
    # --privileged is what flatpak-builder needs to run bubblewrap inside Docker.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/flatpak/io.github.pawslaves.Tinyshot.yml
          bundle: tinyshot.flatpak
          arch: x86_64
          # Flathub's ref for the app; the action defaults to master.
          branch: stable
          artifact-name: flatpak

  release:
    name: GitHub Release
    needs: [deb, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List the release assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.deb
            dist/*.flatpak
          fail_on_unmatched_files: true
          generate_release_notes: true
